name: Build RPi Images

on:
  push:
    branches:
      - main
      - github-runner
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          clean: false

      - name: Ensure build scripts are executable
        run: |
          chmod +x build.sh
          chmod +x scripts/build-rpi.sh

      - name: Build Raspberry Pi artifacts
        env:
          IMAGE_NAME: xtbuilder:latest
        run: ./build.sh

